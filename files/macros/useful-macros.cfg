[gcode_macro RELOAD_CAMERA]
description: Reload camera service
gcode:
  RUN_SHELL_COMMAND CMD=Reload_Camera


[gcode_macro BED_LEVELING]
description: Start full bed leveling (optional POINTS=3..10)
gcode:
  {% set min_points = 3 %}
  {% set max_points = 10 %}
  {% if 'POINTS' in params|upper and 'PROBE_COUNT' in params|upper %}
    { action_raise_error("BED_LEVELING: use POINTS or PROBE_COUNT, not both") }
  {% elif 'POINTS' in params|upper %}
    {% set points_x = params.POINTS|int %}
    {% set points_y = points_x %}
    {% set get_count = ('PROBE_COUNT=' ~ points_x ~ ',' ~ points_y) %}
  {% elif 'PROBE_COUNT' in params|upper %}
    {% set counts = params.PROBE_COUNT.split(',') %}
    {% set points_x = counts[0]|int %}
    {% set points_y = counts[1]|default(counts[0])|int %}
    {% set get_count = ('PROBE_COUNT=' ~ points_x ~ ',' ~ points_y) %}
  {% else %}
    {% set configured_count = printer.configfile.settings.bed_mesh.probe_count %}
    {% set configured_count = configured_count if configured_count|length > 1 else configured_count * 2 %}
    {% set points_x = configured_count[0]|int %}
    {% set points_y = configured_count[1]|int %}
    {% set get_count = "" %}
  {% endif %}
  {% if points_x < min_points or points_y < min_points %}
    { action_raise_error("BED_LEVELING: POINTS must be at least 3") }
  {% endif %}
  {% if points_x > max_points or points_y > max_points %}
    { action_raise_error("BED_LEVELING: POINTS must not exceed 10") }
  {% endif %}
  {% set requested_points = points_x * points_y %}
  {% if requested_points > 36 %}
    {% set prtouch_version = printer.configfile.settings['prtouch_v2'].pr_version|default(1)|int if 'prtouch_v2' in printer.configfile.settings else 0 %}
    {% if prtouch_version != 2 %}
      { action_raise_error("BED_LEVELING: grids above 36 points are supported only on PRTouch v2") }
    {% endif %}
    {% if 'prtouch_extended_points' not in printer.configfile.settings %}
      { action_raise_error("BED_LEVELING: install High Resolution Bed Mesh before requesting more than 36 points") }
    {% endif %}
    {% set extension_limit = printer.configfile.settings['prtouch_extended_points'].max_points|default(100)|int %}
    {% if requested_points > extension_limit %}
      { action_raise_error("BED_LEVELING: requested grid exceeds the installed PRTouch extension limit") }
    {% endif %}
  {% endif %}
  {% set mesh_min = printer.configfile.settings.bed_mesh.mesh_min %}
  {% set mesh_max = printer.configfile.settings.bed_mesh.mesh_max %}
  {% set step_x = (mesh_max[0] - mesh_min[0]) / (points_x - 1) %}
  {% set step_y = (mesh_max[1] - mesh_min[1]) / (points_y - 1) %}
  {% set bed_temp = params.BED_TEMP|default(50)|float %}
  {% set hotend_temp = params.HOTEND_TEMP|default(140)|float %}
  {% set nozzle_clear_temp = params.NOZZLE_CLEAR_TEMP|default(240)|float %}
  { action_respond_info("BED_LEVELING: %dx%d (%d points), spacing %.2f x %.2f mm" % (points_x, points_y, requested_points, step_x, step_y)) }
  SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=0
  {% if printer.toolhead.homed_axes != "xyz" %}
    G28
  {% endif %}
  BED_MESH_CLEAR
  NOZZLE_CLEAR HOT_MIN_TEMP={hotend_temp} HOT_MAX_TEMP={nozzle_clear_temp} BED_MAX_TEMP={bed_temp}
  ACCURATE_G28
  M204 S5000
  SET_VELOCITY_LIMIT ACCEL_TO_DECEL=5000
  {% if 'gcode_macro _kamp_settings' in printer.configfile.settings %}
    BED_MESH_CALIBRATE FULL_BED=1 {get_count}
  {% else %}
    BED_MESH_CALIBRATE {get_count}
  {% endif %}
  BED_MESH_OUTPUT
  {% set y_park = printer.toolhead.axis_maximum.y/2 %}
  {% set x_park = printer.toolhead.axis_maximum.x|float - 10.0 %}
  G1 X{x_park} Y{y_park} F20000
  TURN_OFF_HEATERS
  SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=1


[gcode_macro PID_BED]
description: Start Bed PID
gcode:
  G90
  {% if printer.toolhead.homed_axes != "xyz" %}
    G28
  {% endif %}
  G1 Z10 F600
  M106
  PID_CALIBRATE HEATER=heater_bed TARGET={params.BED_TEMP|default(70)}
  M107
  {% set y_park = printer.toolhead.axis_maximum.y/2 %}
  {% set x_park = printer.toolhead.axis_maximum.x|float - 10.0 %}
  G1 X{x_park} Y{y_park} F20000


[gcode_macro PID_HOTEND]
description: Start Hotend PID
gcode:
  G90
  {% if printer.toolhead.homed_axes != "xyz" %}
    G28
  {% endif %}
  G1 Z10 F600
  M106
  PID_CALIBRATE HEATER=extruder TARGET={params.HOTEND_TEMP|default(250)}
  M107
  {% set y_park = printer.toolhead.axis_maximum.y/2 %}
  {% set x_park = printer.toolhead.axis_maximum.x|float - 10.0 %}
  G1 X{x_park} Y{y_park} F20000
  WAIT_TEMP_START


[gcode_macro WARMUP]
description: Stress Test
variable_maxd: 14142.14 ; = SQRT(2*maxy)
gcode:
  {% set min_loops = 2 %}
  {% set max_loops = params.LOOPS|default(3)|int %}
  {% if 'LOOPS' in params|upper %}
    {% if max_loops < min_loops %}
      {% set max_loops = min_loops %}
    {% endif %}
  {% endif %}
  {% set loop_cnt = max_loops %}
  {% set maxx = params.X_ACCEL_MAX|default(10000)|int %}
  {% set maxy = params.Y_ACCEL_MAX|default(10000)|int %}
  {% set max_x = (printer.toolhead.axis_maximum.x|int-5) %}
  {% set max_y = (printer.toolhead.axis_maximum.y|int-5) %}
  {% set loop_step_y = max_y//(loop_cnt-1) %}
  {% set loop_step_x = max_x//(loop_cnt-1) %}
  {% set y_park = printer.toolhead.axis_maximum.y/2 %}
  {% set x_park = printer.toolhead.axis_maximum.x|float - 10.0 %}
  {% if printer.toolhead.homed_axes != "xyz" %}
    G28
  {% endif %}
  SET_VELOCITY_LIMIT ACCEL={maxx} ACCEL_TO_DECEL={maxx/2}
  {% for number in range(10,max_y+11,loop_step_y) %}
    {% if number >= max_y %}
    {% set number = max_y %}
    {% endif %}
    G1 F{maxy} X10 Y{number}
    G1 F{maxx} X{max_x} Y{number}
  {% endfor %}
  SET_VELOCITY_LIMIT ACCEL={maxy} ACCEL_TO_DECEL={maxy/2}
  {% for number in range(10,max_x+11,loop_step_y) %}
    {% if number >= max_x %}
    {% set number = max_x %}
    {% endif %}
    G1 F{maxy} X{number} Y{max_y}
    G1 F{maxy} X{number} Y10
  {% endfor %}
  SET_VELOCITY_LIMIT ACCEL={maxd} ACCEL_TO_DECEL={maxd/2}
  {% for times in range(loop_cnt) %}
    G1 F{maxx} X10 Y10
    G1 F{maxd} X{max_x} Y{max_y}
    G1 F{maxx} X10 Y{max_y}
    G1 F{maxd} X{max_x} Y10
    G1 F{maxy} X{max_x} Y{max_y}
    G1 F{maxd} X10 Y10
    G1 F{maxy} X10 Y{max_y}
    G1 F{maxd} X{max_x} Y10
  {% endfor %}
  SET_VELOCITY_LIMIT ACCEL={maxx} ACCEL_TO_DECEL={maxx/2}
  {% for times in range(loop_cnt) %}
    G1 F{maxy} X10 Y10
    G1 F{maxy} X10 Y{max_y}
    G1 F{maxx} X{max_x} Y{max_y}
    G1 F{maxy} X{max_x} Y10
    G1 F{maxx} X10 Y10
    G1 F{maxx} X{max_x} Y10
    G1 F{maxy} X{max_x} Y{max_y}
    G1 F{maxx} X10 Y{max_y}
  {% endfor %}
  G1 X{x_park} Y{y_park} F30000
